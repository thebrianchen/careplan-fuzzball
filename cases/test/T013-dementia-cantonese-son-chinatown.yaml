visit:
  visit_id: V-T013
  date: '2026-10-29'
  setting: geriatrics follow-up; son answers for the patient
  transcript:
  - ref: turn:T01
    speaker: doctor
    text: How has your mother been since September?
  - ref: turn:T02
    speaker: caregiver
    text: More confused in the afternoons. She left the stove on twice. And she went out looking for my father, who's been
      gone ten years.
  - ref: turn:T03
    speaker: doctor
    text: She shouldn't be alone during the day anymore. There's an adult day program on the West Side that takes her plan,
      Monday to Friday, drop-off at eight.
  - ref: turn:T04
    speaker: caregiver
    text: I'm at work by seven. I leave the house at six-fifteen. She can't take the bus alone, she'd get lost, and I can't
      be downtown and driving her to the West Side at eight.
    topics:
    - transport
  - ref: turn:T05
    speaker: doctor
    text: Does the program run a van?
  - ref: turn:T06
    speaker: caregiver
    text: I don't know. Nobody said.
  - ref: turn:T07
    speaker: doctor
    text: We'll ask. I'd also like you in the caregiver class here, six Thursdays at ten in the morning.
  - ref: turn:T08
    speaker: caregiver
    text: Thursday at ten I'm on a boiler somewhere. I don't have that kind of flexibility, they'd dock me.
    topics:
    - work_schedule
  - ref: turn:T09
    speaker: doctor
    text: Understood. We'll go up on the donepezil. Who gives her the pills?
  - ref: turn:T10
    speaker: caregiver
    text: I do, morning and night. I fill the box on Sundays.
  - ref: turn:T11
    speaker: doctor
    text: Good. Stove knob covers, take up the loose rugs, night lights, and a bracelet with your number on it.
  - ref: turn:T12
    speaker: caregiver
    text: I ordered the knob covers already.
  - ref: turn:T13
    speaker: doctor
    text: And how are you holding up?
  - ref: turn:T14
    speaker: caregiver
    text: Tired. But I'm managing.
