visit:
  visit_id: V-T003
  date: '2026-10-27'
  setting: neurology post-discharge visit
  transcript:
  - ref: turn:T01
    speaker: doctor
    text: You've been home a week from rehab. How are the right arm and leg?
  - ref: turn:T02
    speaker: patient
    text: The leg's coming back. The arm's still weak, I drop things.
  - ref: turn:T03
    speaker: doctor
    text: The rehab team wants you in outpatient therapy three days a week at the hospital rehab center. Can you get here
      that often?
  - ref: turn:T04
    speaker: patient
    text: Not on my own. I can't drive now, and my daughter works seven to five. She took today off to bring me.
    topics:
    - transport
  - ref: turn:T05
    speaker: doctor
    text: What about the bus?
  - ref: turn:T06
    speaker: patient
    text: With the walker? From 111th it's the Michigan bus and then a transfer. I'm not steady enough for that yet.
    topics:
    - transport
  - ref: turn:T07
    speaker: doctor
    text: Understood. For speech, the therapist can see you by video twice a week from home.
  - ref: turn:T08
    speaker: patient
    text: If you say so.
  - ref: turn:T09
    speaker: doctor
    text: Any trouble with the bills from the hospital stay?
  - ref: turn:T10
    speaker: patient
    text: They sent one for the rehab, twenty percent of something. I'm on a fixed income. I haven't opened the second one
      yet.
    topics:
    - other_cost
  - ref: turn:T11
    speaker: doctor
    text: I'll have the financial counselor call you. Are you taking the apixaban morning and night?
  - ref: turn:T12
    speaker: patient
    text: Every morning and every night. My daughter set up the pill box.
  - ref: turn:T13
    speaker: doctor
    text: Good. Check your blood pressure every morning and write it down for me.
  - ref: turn:T14
    speaker: patient
    text: I can do that.
