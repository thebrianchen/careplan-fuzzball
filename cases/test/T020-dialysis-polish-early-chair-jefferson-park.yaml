visit:
  visit_id: V-T020
  date: '2026-10-28'
  setting: nephrology clinic, urgent follow-up for missed treatments; phone interpreter
  transcript:
  - ref: turn:T01
    speaker: doctor
    text: The unit says you've missed four treatments this month, and your potassium was 6.1 on Friday. That's dangerous.
      What's been going on?
  - ref: turn:T02
    speaker: interpreter
    text: I have been very tired. My wife is in the rehabilitation hospital since she fell. It has been a hard month.
  - ref: turn:T03
    speaker: doctor
    text: I'm sorry to hear that. Are you taking the binders with your meals?
  - ref: turn:T04
    speaker: interpreter
    text: Yes, with every meal.
  - ref: turn:T05
    speaker: doctor
    text: Let's go over the diet again. I'll give you the handout on potassium.
  - ref: turn:T06
    speaker: interpreter
    text: The papers are in English. My daughter reads them to me on the telephone, but she is in Arizona and she works. Can
      I have it in Polish?
    topics:
    - language_literacy
  - ref: turn:T07
    speaker: doctor
    text: We'll find you a Polish version. Any chest pain, palpitations, weakness?
  - ref: turn:T08
    speaker: interpreter
    text: Weakness, yes. My legs are heavy.
  - ref: turn:T09
    speaker: doctor
    text: I also want you weighing yourself and checking your blood pressure every morning at home.
  - ref: turn:T10
    speaker: interpreter
    text: I have the scale and the cuff. I write in a notebook.
  - ref: turn:T11
    speaker: doctor
    text: That's fine. And the insulin at night?
  - ref: turn:T12
    speaker: interpreter
    text: Every night. My wife used to do it; now I do it myself.
  - ref: turn:T13
    speaker: doctor
    text: I'll have the unit social worker check in with you today as well.
  - ref: turn:T14
    speaker: interpreter
    text: Thank you, doctor.
draft_plan:
- item_id: P1
  type: appointment
  text: Continue in-center hemodialysis Monday/Wednesday/Friday 5:30 AM at DaVita Irving Park Dialysis; no missed sessions
  schedule: MWF 05:30
- item_id: P2
  type: education
  text: 'Renal diet re-education: low-potassium food list and handout; avoid high-potassium fruits, potatoes and salt substitutes'
- item_id: P3
  type: monitoring
  text: Daily morning weight and blood pressure in the notebook; bring to each session
- item_id: P4
  type: medication
  text: Continue sevelamer 800 mg with meals, calcitriol 0.25 mcg daily, insulin glargine 14 units nightly
- item_id: P5
  type: monitoring
  text: Repeat potassium and PTH at the next dialysis session; nephrology follow-up in 4 weeks
  schedule: once, ~2026-11-25
