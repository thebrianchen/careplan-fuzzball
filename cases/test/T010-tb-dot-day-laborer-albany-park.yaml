visit:
  visit_id: V-T010
  date: '2026-10-26'
  setting: TB clinic physician visit with in-person interpreter
  transcript:
  - ref: turn:T01
    speaker: doctor
    text: You missed three of your observed doses last week. The medicine only works if you take it every day for the full
      course. What's getting in the way?
  - ref: turn:T02
    speaker: interpreter
    text: The clinic opens at eight. The work vans pick us up at six on Lawrence. If I'm not there, I don't work that day.
      The three days I came here I lost the whole day's pay.
    topics:
    - work_schedule
  - ref: turn:T03
    speaker: doctor
    text: Do you have a smartphone? We can watch you take the dose on video instead of in person.
  - ref: turn:T04
    speaker: interpreter
    text: Yes, I have a phone with WhatsApp. I use it with my family every day.
  - ref: turn:T05
    speaker: doctor
    text: Good. Are you taking any pills on the days you miss?
  - ref: turn:T06
    speaker: interpreter
    text: I have no pills at home. You give them here.
  - ref: turn:T07
    speaker: doctor
    text: Right, that's how observed therapy works. Any yellowing of the eyes, nausea, belly pain, changes in your vision?
  - ref: turn:T08
    speaker: interpreter
    text: No. My urine is orange. The nurse said that is normal.
  - ref: turn:T09
    speaker: doctor
    text: What about paying for any of this?
  - ref: turn:T10
    speaker: interpreter
    text: I have no insurance. The nurse said the TB program pays for everything. I hope that is true.
    topics:
    - other_cost
  - ref: turn:T11
    speaker: doctor
    text: 'It is. The medicines, the visits and the tests are free through the health department. One more thing: the men
      you live with need to be tested.'
  - ref: turn:T12
    speaker: interpreter
    text: I told them. Two already came in.
    topics:
    - housing
