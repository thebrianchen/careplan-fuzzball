visit:
  visit_id: V-T004
  date: '2026-10-27'
  setting: prenatal visit, 28 weeks, with phone interpreter
  transcript:
  - ref: turn:T01
    speaker: doctor
    text: You're twenty-eight weeks today. From now on I need to see you every two weeks, and every week after thirty-six.
  - ref: turn:T02
    speaker: interpreter
    text: Every two weeks is hard. I missed the visit two weeks ago because I couldn't leave work. I pack at a candy factory
      on Kedzie, six to two-thirty. They allow two unexcused absences and after that they let you go.
    topics:
    - work_schedule
  - ref: turn:T03
    speaker: doctor
    text: Could you come after your shift, say three o'clock?
  - ref: turn:T04
    speaker: interpreter
    text: After work would be fine. The ten o'clock is the problem.
    topics:
    - work_schedule
  - ref: turn:T05
    speaker: doctor
    text: I also need the glucose test. You drink the sugar drink and we draw blood one hour later.
  - ref: turn:T06
    speaker: interpreter
    text: Can I do that here, today?
  - ref: turn:T07
    speaker: doctor
    text: Yes, right here in the clinic lab. And there's a childbirth class I'd like you to sign up for.
  - ref: turn:T08
    speaker: interpreter
    text: Okay.
  - ref: turn:T09
    speaker: doctor
    text: How do you get here?
  - ref: turn:T10
    speaker: interpreter
    text: My husband drops me off on his way to work, or I take the Archer bus. It's not far.
  - ref: turn:T11
    speaker: doctor
    text: How is the iron pill sitting with you?
  - ref: turn:T12
    speaker: interpreter
    text: It upsets my stomach a little, but I take it with dinner like you said.
