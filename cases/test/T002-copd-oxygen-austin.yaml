visit:
  visit_id: V-T002
  date: '2026-10-28'
  setting: post-hospital pulmonology visit
  transcript:
  - ref: turn:T01
    speaker: doctor
    text: You were in the hospital for a flare about three weeks ago. How's the breathing now?
  - ref: turn:T02
    speaker: patient
    text: Better than it was. I still can't do a flight of stairs without stopping.
  - ref: turn:T03
    speaker: doctor
    text: I want to get you into pulmonary rehab. It's here at the hospital, twice a week for eight weeks, and it makes a
      real difference.
  - ref: turn:T04
    speaker: patient
    text: That's two buses with the oxygen tank. Chicago Avenue and then the Pulaski bus. Getting here today took an hour
      and a half and I was wiped out before I walked in.
    topics:
    - transport
  - ref: turn:T05
    speaker: doctor
    text: Is there anyone who could drive you?
  - ref: turn:T06
    speaker: patient
    text: My nephew, now and then. He's got his own job.
    topics:
    - transport
  - ref: turn:T07
    speaker: doctor
    text: Are the inhalers okay cost-wise?
  - ref: turn:T08
    speaker: patient
    text: Few dollars each with the Medicaid. That part's fine.
    topics:
    - med_cost
  - ref: turn:T09
    speaker: doctor
    text: Are you wearing the oxygen at night and when you walk?
  - ref: turn:T10
    speaker: patient
    text: Most nights. I take the little tank when I go out.
  - ref: turn:T11
    speaker: doctor
    text: Still smoking?
  - ref: turn:T12
    speaker: patient
    text: Three or four a day. I want to be done with it.
  - ref: turn:T13
    speaker: doctor
    text: Good, we'll use the patch and a pill to help. You've also lost about eight pounds since summer. I want you eating
      six small meals a day with protein in each one.
  - ref: turn:T14
    speaker: patient
    text: All right, doc.
