visit:
  visit_id: V-T012
  date: '2026-10-26'
  setting: wound care center, weekly physician review
  transcript:
  - ref: turn:T01
    speaker: doctor
    text: The ulcer is down from three centimeters to about two. It's healing, but slowly, and you've missed two of the Monday
      visits.
  - ref: turn:T02
    speaker: patient
    text: Mondays the buses are a mess. I take the 30 to the 95th Street station and then another bus up here. Eight o'clock
      means leaving at six-fifteen, and with the foot it's slow going.
    topics:
    - transport
  - ref: turn:T03
    speaker: doctor
    text: Anyone with a car?
  - ref: turn:T04
    speaker: patient
    text: Not that I can lean on. The guy I'm staying with works nights and sleeps mornings.
    topics:
    - transport
  - ref: turn:T05
    speaker: doctor
    text: How are you keeping weight off that foot?
  - ref: turn:T06
    speaker: patient
    text: I wear the boot when I go out. Around the house I don't bother.
  - ref: turn:T07
    speaker: doctor
    text: You need it any time you're standing. I'm also going to have a visiting nurse come three times a week to change
      the dressing between visits.
  - ref: turn:T08
    speaker: patient
    text: Three times a week? Okay.
  - ref: turn:T09
    speaker: doctor
    text: How are the sugars?
  - ref: turn:T10
    speaker: patient
    text: Mornings around one-sixty. I take the metformin.
  - ref: turn:T11
    speaker: doctor
    text: Are you eating regular meals?
  - ref: turn:T12
    speaker: patient
    text: Two a day. Enough.
  - ref: turn:T13
    speaker: doctor
    text: Call the clinic if there's redness going up the leg, fever, or drainage that smells.
  - ref: turn:T14
    speaker: patient
    text: I will.
