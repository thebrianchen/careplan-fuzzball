visit:
  visit_id: V-T007
  date: '2026-10-28'
  setting: primary care follow-up, early evening
  transcript:
  - ref: turn:T01
    speaker: doctor
    text: Your PHQ-9 is down from nineteen to fourteen. How's the sertraline treating you?
  - ref: turn:T02
    speaker: patient
    text: Some. I'm sleeping a little better. Still dragging through the day.
  - ref: turn:T03
    speaker: doctor
    text: I'd like to go up to a hundred and keep you in weekly therapy. You missed last Tuesday's session.
  - ref: turn:T04
    speaker: patient
    text: My schedule changed. I work at the Target on 87th and they post the shifts every Sunday. Some weeks I'm on Tuesday
      afternoon, some weeks I'm not. I can't promise the same day every week.
    topics:
    - work_schedule
  - ref: turn:T05
    speaker: doctor
    text: Would a fixed evening slot be easier?
  - ref: turn:T06
    speaker: patient
    text: Evenings move too. The only time they never schedule me is before ten in the morning.
    topics:
    - work_schedule
  - ref: turn:T07
    speaker: doctor
    text: Who has your daughter when you're working?
  - ref: turn:T08
    speaker: patient
    text: My mother. She's retired, she's got her.
    topics:
    - caregiving
  - ref: turn:T09
    speaker: doctor
    text: The care manager can also check in with you between sessions.
  - ref: turn:T10
    speaker: patient
    text: Okay.
  - ref: turn:T11
    speaker: doctor
    text: How do you get to the clinic?
  - ref: turn:T12
    speaker: patient
    text: The 6 goes straight there. Or my mother drives me.
  - ref: turn:T13
    speaker: doctor
    text: Are you getting outside and moving at all?
  - ref: turn:T14
    speaker: patient
    text: Not really. I walk to the bus, that's about it.
