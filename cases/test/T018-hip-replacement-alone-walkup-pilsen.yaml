visit:
  visit_id: V-T018
  date: '2026-10-28'
  setting: orthopedic clinic, two-week post-operative visit
  transcript:
  - ref: turn:T01
    speaker: doctor
    text: Two weeks out. Let's look at the hip. How's the pain?
  - ref: turn:T02
    speaker: patient
    text: A five on the stairs, a three on the flat. I'm using the walker.
  - ref: turn:T03
    speaker: doctor
    text: The incision looks good. I want you in outpatient therapy three times a week for six weeks at the hospital rehab
      center.
  - ref: turn:T04
    speaker: patient
    text: Three times a week. I can't drive until you say so, and I've got nobody here. My son's in Texas.
    topics:
    - transport
  - ref: turn:T05
    speaker: doctor
    text: What about the bus?
  - ref: turn:T06
    speaker: patient
    text: The 18th Street bus is right there, but it's the stairs down from my apartment and then the walker on the bus. I'm
      not ready for that.
    topics:
    - transport
  - ref: turn:T07
    speaker: doctor
    text: Are you doing the blood-thinner shots every day?
  - ref: turn:T08
    speaker: patient
    text: Every morning in the belly. I've got six left.
  - ref: turn:T09
    speaker: doctor
    text: Good. With your bone density and living alone I want to extend those to five weeks total. The shower and the toilet,
      are you managing?
  - ref: turn:T10
    speaker: patient
    text: I'm managing. I sit on the edge of the tub.
  - ref: turn:T11
    speaker: doctor
    text: I'd rather you had a proper seat and a shower chair. Keep walking every day, a little more each time, and no bending
      past ninety degrees.
  - ref: turn:T12
    speaker: patient
    text: I know the rules.
  - ref: turn:T13
    speaker: doctor
    text: Is your phone working if the therapist calls to schedule?
  - ref: turn:T14
    speaker: patient
    text: It's a regular cell phone. No internet, but it rings.
    topics:
    - digital_access
