  transcript:
  - ref: turn:T01
    speaker: doctor
    text: Your viral load came back at 2,400. In July it was undetectable. What changed?
  - ref: turn:T02
    speaker: patient
    text: I missed some days. Couple of weeks, maybe.
  - ref: turn:T03
    speaker: doctor
    text: What happened?
  - ref: turn:T04
    speaker: patient
    text: Stuff got lost. I'm back on it now, I've got the bottle on me.
  - ref: turn:T05
    speaker: doctor
    text: I need you taking it every day at the same time, and I'll recheck the viral load in four weeks. Can you make the
      lab?
  - ref: turn:T06
    speaker: patient
    text: Yeah. The Halsted bus goes straight up.
  - ref: turn:T07
    speaker: doctor
    text: How's your appetite? You're down nine pounds since July.
  - ref: turn:T08
    speaker: patient
    text: I eat when I can.
  - ref: turn:T09
    speaker: doctor
    text: Mood, drinking, anything else going on?
  - ref: turn:T10
    speaker: patient
    text: No. I'm all right.
  - ref: turn:T11
    speaker: doctor
    text: The case manager will set up reminders through the portal for the pills and the lab date.
  - ref: turn:T12
    speaker: patient
    text: My phone's cracked but it works. I've got the app.
  - ref: turn:T13
    speaker: doctor
    text: Good. I'll also send a ninety-day supply so you're not back at the pharmacy every month.
  - ref: turn:T14
    speaker: patient
    text: Okay.
