visit:
  visit_id: V-T011
  date: '2026-10-27'
  setting: oncology clinic before cycle 2
  transcript:
  - ref: turn:T01
    speaker: doctor
    text: How did you do after the first cycle?
  - ref: turn:T02
    speaker: patient
    text: Tired for four days. And the cold thing, I couldn't take anything out of the fridge without my fingers tingling.
  - ref: turn:T03
    speaker: doctor
    text: That's the oxaliplatin. We'll watch it. Nausea?
  - ref: turn:T04
    speaker: patient
    text: The first two days. The pills helped.
  - ref: turn:T05
    speaker: doctor
    text: Good. Cycle two today, pump off Thursday, and we keep going every two weeks for twelve cycles. Is the schedule working
      with your job?
  - ref: turn:T06
    speaker: patient
    text: I'm on leave from the hotel until March. They approved it, so that part's okay.
    topics:
    - work_schedule
  - ref: turn:T07
    speaker: doctor
    text: Who brings you on infusion days?
  - ref: turn:T08
    speaker: patient
    text: My husband. He switches to the night shift those days.
  - ref: turn:T09
    speaker: doctor
    text: I want you eating as much protein as you can manage. Eggs, chicken, beans, yogurt. Small meals through the day,
      especially the week after treatment.
  - ref: turn:T10
    speaker: patient
    text: I'll try.
  - ref: turn:T11
    speaker: doctor
    text: Any mouth sores, fever, numbness in the feet?
  - ref: turn:T12
    speaker: patient
    text: No fever. A little tingling in the toes.
  - ref: turn:T13
    speaker: doctor
    text: Tell the nurse the day that gets worse. Keep a thermometer handy, anything over 100.4 you call us.
  - ref: turn:T14
    speaker: patient
    text: I know.
