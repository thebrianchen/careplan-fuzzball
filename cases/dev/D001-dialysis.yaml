visit:
  visit_id: V-D001
  date: '2026-10-21'
  setting: nephrology clinic follow-up
  transcript:
  - ref: turn:T01
    speaker: doctor
    text: The dialysis unit tells me you've missed three sessions this month. What's been going on?
  - ref: turn:T02
    speaker: patient
    text: I don't drive anymore. I sold the car in August, couldn't keep up with the insurance.
    topics:
    - transport
    - other_cost
  - ref: turn:T03
    speaker: doctor
    text: How have you been getting to the unit?
  - ref: turn:T04
    speaker: patient
    text: Two buses, all the way down to Park Manor. That was the only chair they had, three o'clock. I'm out the door by
      one-thirty, and after four hours on the machine it's two more buses home. I don't get in till eight-thirty. Some days
      I just don't go.
    topics:
    - transport
  - ref: turn:T05
    speaker: doctor
    text: Is there anyone who can drive you?
  - ref: turn:T06
    speaker: patient
    text: My daughter's in Indiana. My neighbor helped a couple times but he works days.
    topics:
    - transport
    - caregiving
  - ref: turn:T07
    speaker: doctor
    text: Let's talk about food. How are you eating on dialysis days?
  - ref: turn:T08
    speaker: patient
    text: Mostly whatever the corner store has. Chips, lunch meat. The real grocery is a bus ride away and I'm wiped out after
      treatment.
    topics:
    - food_access
    - transport
  - ref: turn:T09
    speaker: doctor
    text: And the phosphate binder, the sevelamer?
  - ref: turn:T10
    speaker: patient
    text: I take it when I eat. If I skip lunch I skip the pill too.
    topics:
    - food_access
  - ref: turn:T11
    speaker: doctor
    text: Any trouble paying for your medicines?
  - ref: turn:T12
    speaker: patient
    text: No, the copays are a few dollars. That part's fine.
    topics:
    - med_cost
  - ref: turn:T13
    speaker: doctor
    text: I'd also like the surgeons to look at your fistula in two weeks.
  - ref: turn:T14
    speaker: patient
    text: Another trip downtown? I'll try.
    topics:
    - transport
