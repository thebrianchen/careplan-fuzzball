  - id: utility_medical_certificate
    category: medical_certificate_utilities
    needs: [utilities]
    eligible_when: "a household member's health depends on utility service (e.g. refrigerated insulin, powered equipment)"
    how_to_start: "Clinician completes the utility's medical certification form to delay disconnection."
    caveats: "Illinois utility rules allow a medical certification to postpone disconnection for a limited time; verify the current rule and duration."
