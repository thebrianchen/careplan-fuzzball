# Smallest GPU job: confirms a job on one of our nodes sees the GB10 and our models volume.
version: v4
volumes:
  models: {use: team4, name: models}
jobs:
  check:
    image: {uri: docker://rockylinux:9}
    mounts: {/models: models}
    script: |
      #!/bin/sh
      hostname; nvidia-smi; free -g | head -2; du -sh /models/* 2>/dev/null; df -h /models | tail -1
    resource:
      cpu: {cores: 2}
      memory: {size: 4GB}
      devices: {nvidia.com/gpu: 1}
