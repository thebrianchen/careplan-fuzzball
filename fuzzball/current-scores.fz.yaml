# Case scores, measured on the event cluster: transcript-only against Care Plan Check, on the held-out cases and the
# dev cases, scored against the physician-reviewed keys. The planner comes up as a service on one GB10, the job
# reaches it by name on the workflow network, and the planner stops when the job finishes.
# The CPU job runs in a Rocky Linux 9 container with the Python and packages that code.fz.yaml put on the volume.
# Results: runs/ and results/scores_<TAG>_<set>.json on the persistent "code" volume.
#   fuzzball workflow start scores.fz.yaml --name scores-1
version: v4
volumes:
  models: {use: team4, name: models}
  code: {use: team4, name: code}
services:
  planner:
    image: {uri: docker://vllm/vllm-openai:v0.32.0}
    mounts: {/models: models}
    env:
      - HOME=/models/home
      - USER=careplan
      - XDG_CACHE_HOME=/models/home/.cache
      - HF_HUB_OFFLINE=1
      - MAX_JOBS=2
      - NVCC_THREADS=1
      - SEQS=3
    script: |
      #!/bin/bash
      mkdir -p "$XDG_CACHE_HOME"
      M=/models/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
      exec vllm serve $M --served-model-name nemotron-3.5-super-vl \
        --max-num-seqs ${SEQS:-1} --trust-remote-code --gpu-memory-utilization 0.75 --max-num-batched-tokens 8192 \
        --speculative_config.model $M-LiLiCorr \
        --speculative_config.num_speculative_tokens 7 --speculative_config.method dflash \
        --mamba-backend flashinfer --mamba-ssm-cache-dtype float16 --enable-mamba-cache-stochastic-rounding \
        --mamba-cache-philox-rounds 5 --enable-mamba-shared-prefix-checkpoint \
        --video-pruning-rate 0.5 --media-io-kwargs '{"video": {"fps": 2, "num_frames": 256}}' \
        --block-size 64 --prefix-match-unit 64 \
        --enable-auto-tool-choice --tool-call-parser qwen3_coder --reasoning-parser nemotron_v3 \
        --host 0.0.0.0 --port 8000
    resource:
      cpu: {cores: 12}
      memory: {size: 110GB}
      devices: {nvidia.com/gpu: 1}
    network:
      ports:
        - {name: openai, port: 8000, protocol: tcp}
    readiness-probe:
      http-get: {path: /health, port: 8000, scheme: HTTP}
      initial-delay-seconds: 60
      period-seconds: 15
      timeout-seconds: 5
      failure-threshold: 240
jobs:
  scores:
    image: {uri: docker://rockylinux/rockylinux:9}
    mounts: {/code: code}
    cwd: /code/app
    env:
      - PYTHONPATH=/code/site
      - PATH=/code/python/bin:/usr/local/bin:/usr/bin:/bin
      - PLANNER_URL=http://planner:8000/v1
      - VLLM_API_KEY=none
      - PROFILE=super35-vllm-think
      - TAG=event1
    script: |
      #!/bin/sh
      # first, one card on the dialysis case: the day's first sign that planner, code and volumes work together
      mkdir -p /code/one /code/results && cp cases/dev/D001-dialysis.yaml /code/one/
      python3 -m careplan run --cases /code/one --conditions C2 --reps 1 --signals --allow-unfrozen \
        --profile C2=$PROFILE --tag ${TAG}_first | tail -2
      python3 scripts/run_detail.py $(ls -dt runs/*_${TAG}_first | head -1) --cases /code/one | tail -3
      # three runs of each case set at once: the planner serves three requests at a time
      for set in test dev; do
        for r in a b c; do
          python3 -m careplan run --cases cases/$set --conditions C0,C2 --reps 1 --signals --allow-unfrozen \
            --profile C0=$PROFILE --profile C2=$PROFILE --tag ${TAG}_${set}_$r > /code/results/scores_${TAG}_${set}_$r.log 2>&1 &
        done
        wait
        python3 scripts/h1_report.py $(ls -dt runs/*_${TAG}_${set}_? | head -3) --cases cases/$set \
          --out /code/results/scores_${TAG}_$set.json | tail -3
      done
    depends-on:
      - {name: planner, status: RUNNING}
    policy: {timeout: {execute: 6h}}
    resource:
      cpu: {cores: 2}
      memory: {size: 2GB}
