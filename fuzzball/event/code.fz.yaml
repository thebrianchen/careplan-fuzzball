# Puts our code on the persistent "code" volume and checks it there. Four uploads, so a code change is a small
# upload and everything else is installed once:
#   python.tgz            a self-contained Python 3.12 for arm64 Linux (python-build-standalone 20261026), so the CPU
#                         jobs can run in a plain Rocky Linux 9 container with no network
#   careplan-bundle.tgz   offline Python packages (wheels), training examples, a baseline copy of the code
#   app.tgz               the current code, cases and neighborhood data
#   vllm-cache.tgz        kernels compiled on our own GB10 with the same vLLM image, so the planner's first start
#                         on the cluster does not spend 15 to 40 minutes compiling them
# Before starting:
#   fuzzball volume create team4 code --size 20GiB
#   fuzzball object put --force python.tgz fb://group/python.tgz      (and the other three)
version: v4
volumes:
  code:
    use: team4
    name: code
    ingress:
      - source: {uri: "fb://group/python.tgz"}
        destination: {uri: "file://python.tgz"}
      - source: {uri: "fb://group/careplan-bundle.tgz"}
        destination: {uri: "file://careplan-bundle.tgz"}
      - source: {uri: "fb://group/app.tgz"}
        destination: {uri: "file://app.tgz"}
      - source: {uri: "fb://group/vllm-cache.tgz"}
        destination: {uri: "file://vllm-cache.tgz"}
  models: {use: team4, name: models}
jobs:
  unpack:
    image: {uri: docker://rockylinux/rockylinux:9}
    mounts: {/code: code, /models: models}
    env:
      - HOME=/tmp
      - PYTHONPATH=/code/site
      - PATH=/code/python/bin:/usr/local/bin:/usr/bin:/bin
    script: |
      #!/bin/sh
      set -e
      cd /code
      cat /etc/rocky-release
      [ -x python/bin/python3 ] || tar -xzf python.tgz
      if [ ! -d bundle/wheels ] || [ careplan-bundle.tgz -nt bundle/.unpacked ]; then
        rm -rf bundle && tar -xzf careplan-bundle.tgz && touch bundle/.unpacked
      fi
      rm -rf app.new && mkdir app.new && tar -xzf app.tgz -C app.new --strip-components 1
      mkdir -p runs results app.new/data/synth
      cp -r bundle/app/data/synth/. app.new/data/synth/
      rm -rf app.new/runs && ln -s /code/runs app.new/runs
      rm -rf app.old; [ -d app ] && mv app app.old; mv app.new app; rm -rf app.old
      if [ "$(cat site/.requirements 2>/dev/null)" != "$(cat app/requirements.txt)" ]; then
        rm -rf site && python3 -m pip install -q --no-index --find-links bundle/wheels -r app/requirements.txt --target site
        cp app/requirements.txt site/.requirements
      fi
      if [ ! -d /models/home/.cache/flashinfer ]; then
        mkdir -p /models/home && tar -xzf vllm-cache.tgz -C /models/home && echo "compiled kernels unpacked"
      fi
      cd /code/app
      python3 --version
      python3 -m careplan validate cases/ | tail -1
      python3 -m unittest discover -s tests 2>&1 | grep -E "^(Ran|OK|FAILED)"
      cat VERSION; du -sh /code/python /code/site /code/app /models/home/.cache
    resource:
      cpu: {cores: 4}
      memory: {size: 8GB}
