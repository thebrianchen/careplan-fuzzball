# First job of the day: what does a job on one of our nodes actually get? GPU, memory, our volumes, the user it
# runs as, where it can write, and whether it can reach the internet. The answers set up everything after it.
version: v4
volumes:
  models: {use: team4, name: models}
jobs:
  check:
    image: {uri: docker://rockylinux/rockylinux:9}
    mounts: {/models: models}
    script: |
      #!/bin/sh
      echo "== host $(hostname) | $(cat /etc/rocky-release) | kernel $(uname -r) | $(nproc) cores"
      echo "== user $(id) | HOME=$HOME | cwd $(pwd)"
      nvidia-smi 2>&1 | head -15
      grep -E "MemTotal|MemAvailable" /proc/meminfo
      echo "== models volume"; df -h /models | tail -1; du -sh /models/* 2>/dev/null
      for d in / /tmp /root /models "$HOME"; do touch "$d/.w" 2>/dev/null && { rm -f "$d/.w"; echo "writable: $d"; } || echo "read-only: $d"; done
      echo "== internet"; for u in https://pypi.org https://huggingface.co https://github.com; do curl -s -m 8 -o /dev/null -w "$u %{http_code}\n" $u || echo "$u unreachable"; done
      echo "== Fuzzball env"; env | grep -E "^FB_|^FUZZBALL" | sed "s/TOKEN=.*/TOKEN=(set)/" | sort
    resource:
      cpu: {cores: 2}
      memory: {size: 4GB}
      devices: {nvidia.com/gpu: 1}
