# Trains the small model on one GB10: Nemotron 3 Nano 30B plus a small add-on (LoRA), one pass over the training
# examples. It runs in the same vLLM image the planner uses, so the cluster pulls one image; the two extra Python
# packages come from the wheels on the code volume. The add-on lands on the code volume under adapters/.
# Checkpoints are written every 20 steps and a restart continues from the last one.
version: v4
volumes:
  models: {use: team4, name: models}
  code: {use: team4, name: code}
jobs:
  train:
    image: {uri: docker://vllm/vllm-openai:v0.32.0}
    mounts: {/models: models, /code: code}
    cwd: /code/app
    env:
      - HOME=/tmp
      - USER=careplan
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - OUT=/code/adapters/lora-event1
      - EPOCHS=1
    script: |
      #!/bin/bash
      set -e
      pip install -q --no-index --find-links /code/bundle/wheels --no-deps --target /tmp/pkgs peft==0.21.2 accelerate==1.15.0
      export PYTHONPATH=/tmp/pkgs
      mkdir -p "$(dirname $OUT)"
      python3 training/train_lora.py --model /models/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16 --stream-load \
        --targets q_proj,k_proj,v_proj,o_proj,in_proj --train data/synth/sft_e1_distill_gold/train.jsonl \
        --max-len 10240 --epochs $EPOCHS --out $OUT
      ls -la $OUT | grep adapter
    policy: {timeout: {execute: 6h}}
    resource:
      cpu: {cores: 8}
      memory: {size: 110GB}
      devices: {nvidia.com/gpu: 1}
