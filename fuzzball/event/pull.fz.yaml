# Brings the day's results off the cluster before it shuts down. Packs results/ (small: score and leak reports,
# timings) and runs/ (every card and leak run) on the "code" volume, and exports both to the object cache, where
# `fuzzball object get fb://group/results.tgz` fetches them. In case the export does not work, the small archive
# is also printed to the job log in base64 between two marker lines (scripts/morning.sh pull decodes it).
# Safe to run at any time; it only reads. The export refuses to overwrite an object whose content changed, so do not
# start this file as it is twice: scripts/pull_via_mini.sh and `morning.sh pull` give each run its own object names
# (fb://group/pull/results-<time>.tgz, runs-<time>.tgz) before starting it.
version: v4
volumes:
  code:
    use: team4
    name: code
    egress:
      - source: {uri: "file://out/results.tgz"}
        destination: {uri: "fb://group/results.tgz"}
      - source: {uri: "file://out/runs.tgz"}
        destination: {uri: "fb://group/runs.tgz"}
jobs:
  pack:
    image: {uri: docker://rockylinux/rockylinux:9}
    mounts: {/code: code}
    cwd: /code
    script: |
      #!/bin/sh
      mkdir -p out results runs adapters
      tar -czf out/results.tgz results
      # the trained add-on's weights stay on the volume; its config and logs come along
      # both the leak test and the case scores write under runs/ (app/runs points there)
      tar -czf out/runs.tgz --exclude='*.safetensors' --exclude='checkpoint-*' runs adapters
      ls -l out results; du -sh results runs adapters; ls runs | wc -l
      if [ $(stat -c %s out/results.tgz) -lt 4000000 ]; then
        echo "-----BEGIN RESULTS-----"; base64 -w 76 out/results.tgz; echo "-----END RESULTS-----"
      else
        echo "results.tgz is too large to print; fetch it from the object cache"
      fi
    resource:
      cpu: {cores: 1}
      memory: {size: 1GB}
