# What the second GB10 buys: the same leak test, one pass, with a planner on each node. Six array tasks run at
# once, three against each planner (odd task ids go to planner-a, even to planner-b). Each planner asks for 110 GB,
# so the two cannot share a node. Compare "array wall time" and the run count here with one pass of
# leaktest.fz.yaml (one planner, three tasks at a time): same pages, same model setting.
# Needs both of our nodes free. Results: results/leaktest_<TAG>.json and .times on the "code" volume.
#   fuzzball workflow start scale.fz.yaml --name scale-1
version: v4
volumes:
  models: {use: team4, name: models}
  code: {use: team4, name: code}
services:
  planner-a:
    image: {uri: docker://vllm/vllm-openai:v0.32.0}
    mounts: {/models: models}
    env:
      - HOME=/models/home
      - USER=careplan
      - XDG_CACHE_HOME=/models/home/.cache
      - HF_HUB_OFFLINE=1
      - MAX_JOBS=2
      - NVCC_THREADS=1
      - SEQS=3
    script: |
      #!/bin/bash
      mkdir -p "$XDG_CACHE_HOME"
      M=/models/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
      exec vllm serve $M --served-model-name nemotron-3.5-super-vl \
        --max-num-seqs ${SEQS:-1} --trust-remote-code --gpu-memory-utilization 0.75 --max-num-batched-tokens 8192 \
        --speculative_config.model $M-LiLiCorr \
        --speculative_config.num_speculative_tokens 7 --speculative_config.method dflash \
        --mamba-backend flashinfer --mamba-ssm-cache-dtype float16 --enable-mamba-cache-stochastic-rounding \
        --mamba-cache-philox-rounds 5 --enable-mamba-shared-prefix-checkpoint \
        --video-pruning-rate 0.5 --media-io-kwargs '{"video": {"fps": 2, "num_frames": 256}}' \
        --block-size 64 --prefix-match-unit 64 \
        --enable-auto-tool-choice --tool-call-parser qwen3_coder --reasoning-parser nemotron_v3 \
        --host 0.0.0.0 --port 8000
    resource:
      cpu: {cores: 12}
      memory: {size: 110GB}
      devices: {nvidia.com/gpu: 1}
    network:
      ports:
        - {name: openai, port: 8000, protocol: tcp}
    readiness-probe:
      http-get: {path: /health, port: 8000, scheme: HTTP}
      initial-delay-seconds: 60
      period-seconds: 15
      timeout-seconds: 5
      failure-threshold: 240
  planner-b:
    image: {uri: docker://vllm/vllm-openai:v0.32.0}
    mounts: {/models: models}
    env:
      - HOME=/models/home
      - USER=careplan
      - XDG_CACHE_HOME=/models/home/.cache
      - HF_HUB_OFFLINE=1
      - MAX_JOBS=2
      - NVCC_THREADS=1
      - SEQS=3
    script: |
      #!/bin/bash
      mkdir -p "$XDG_CACHE_HOME"
      M=/models/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
      exec vllm serve $M --served-model-name nemotron-3.5-super-vl \
        --max-num-seqs ${SEQS:-1} --trust-remote-code --gpu-memory-utilization 0.75 --max-num-batched-tokens 8192 \
        --speculative_config.model $M-LiLiCorr \
        --speculative_config.num_speculative_tokens 7 --speculative_config.method dflash \
        --mamba-backend flashinfer --mamba-ssm-cache-dtype float16 --enable-mamba-cache-stochastic-rounding \
        --mamba-cache-philox-rounds 5 --enable-mamba-shared-prefix-checkpoint \
        --video-pruning-rate 0.5 --media-io-kwargs '{"video": {"fps": 2, "num_frames": 256}}' \
        --block-size 64 --prefix-match-unit 64 \
        --enable-auto-tool-choice --tool-call-parser qwen3_coder --reasoning-parser nemotron_v3 \
        --host 0.0.0.0 --port 8000
    resource:
      cpu: {cores: 12}
      memory: {size: 110GB}
      devices: {nvidia.com/gpu: 1}
    network:
      ports:
        - {name: openai, port: 8000, protocol: tcp}
    readiness-probe:
      http-get: {path: /health, port: 8000, scheme: HTTP}
      initial-delay-seconds: 60
      period-seconds: 15
      timeout-seconds: 5
      failure-threshold: 240
jobs:
  redteam:
    image: {uri: docker://rockylinux/rockylinux:9}
    mounts: {/code: code}
    cwd: /code/app
    env:
      - PYTHONPATH=/code/site
      - PATH=/code/python/bin:/usr/local/bin:/usr/bin:/bin
      - VLLM_API_KEY=none
      - PROFILE=super35-vllm-think
      - TAG=scale2
      - SHARDS=6
      - REPS=1
    script: |
      #!/bin/sh
      # six tasks at a time, three per planner
      if [ $((FB_TASK_ID % 2)) = 1 ]; then P=planner-a; else P=planner-b; fi
      export PLANNER_URL=http://$P:8000/v1
      mkdir -p /code/results; s=$(date +%s)
      python3 -m leaktest.run --cases cases/dev --reps $REPS --profile $PROFILE \
        --shard $((FB_TASK_ID - 1))/$SHARDS --tag $TAG --out-root /code/runs; rc=$?
      echo "$FB_TASK_ID $s $(date +%s) $rc" >> /code/results/leaktest_$TAG.times
      exit $rc
    depends-on:
      - {name: planner-a, status: RUNNING}
      - {name: planner-b, status: RUNNING}
    task-array: {start: 1, end: 6, concurrency: 6}
    policy: {timeout: {execute: 4h}}
    resource:
      cpu: {cores: 1}
      memory: {size: 2GB}
  leak-report:
    image: {uri: docker://rockylinux/rockylinux:9}
    mounts: {/code: code}
    cwd: /code/app
    env:
      - PYTHONPATH=/code/site
      - PATH=/code/python/bin:/usr/local/bin:/usr/bin:/bin
      - TAG=scale2
    script: |
      #!/bin/sh
      python3 -m leaktest.run --merge /code/runs/*_${TAG}_leaktest_s*of* --out /code/results/leaktest_$TAG.json
      cat /code/results/leaktest_$TAG.json
      awk 'NR==1{a=$2;b=$3} {if($2<a)a=$2; if($3>b)b=$3} END{printf "array wall time: %.1f min over %d tasks\n",(b-a)/60,NR}' /code/results/leaktest_$TAG.times
    depends-on:
      - {name: redteam, status: FINISHED}
    resource:
      cpu: {cores: 1}
      memory: {size: 1GB}
