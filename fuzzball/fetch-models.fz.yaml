# Downloads model weights from Hugging Face into our persistent "models" volume, so serving and training
# workflows start without a download. Planner first; each entry is independent of the others.
version: v4
volumes:
  models:
    use: team4
    name: models
    ingress:
      - source: {uri: "hf://nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4"}
        destination: {uri: "file://NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4"}
        policy: {timeout: {execute: 3h}}
      - source: {uri: "hf://nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4-LiLiCorr"}
        destination: {uri: "file://NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4-LiLiCorr"}
        policy: {timeout: {execute: 1h}}
      - source: {uri: "hf://nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16"}
        destination: {uri: "file://NVIDIA-Nemotron-3-Nano-30B-A3B-BF16"}
        policy: {timeout: {execute: 3h}}
jobs:
  sizes:
    image:
      uri: docker://alpine:3.20
    mounts:
      /models: models
    script: |
      #!/bin/sh
      du -sh /models/* 2>/dev/null; df -h /models | tail -1
    resource:
      cpu:
        cores: 1
      memory:
        size: 1GB
