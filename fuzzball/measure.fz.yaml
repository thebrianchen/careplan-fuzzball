# Every number we report, measured on the event cluster in one workflow:
#   - leak test as a task array: each attack page against the single-agent design and the split design
#   - case scores: transcript-only and Care Plan Check, on the dev cases and the held-out cases
# The planner comes up as a service, the jobs reach it by name on the workflow network, and it stops when they finish.
# Results land on the persistent "code" volume under runs/ and results/.
#   fuzzball workflow start measure.fz.yaml --name measure-1
version: v4
volumes:
  models: {use: team4, name: models}
  code: {use: team4, name: code}
services:
  planner:
    image: {uri: docker://vllm/vllm-openai:v0.32.0}
    mounts: {/models: models}
    env:
      - HOME=/models/home
      - XDG_CACHE_HOME=/models/home/.cache
      - HF_HUB_OFFLINE=1
      - MAX_JOBS=2
      - NVCC_THREADS=1
      - SEQS=3
    script: |
      #!/bin/bash
      mkdir -p "$XDG_CACHE_HOME"
      M=/models/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
      exec vllm serve $M --served-model-name nemotron-3.5-super-vl \
        --max-num-seqs ${SEQS:-1} --trust-remote-code --gpu-memory-utilization 0.75 --max-num-batched-tokens 8192 \
        --speculative_config.model $M-LiLiCorr \
        --speculative_config.num_speculative_tokens 7 --speculative_config.method dflash \
        --mamba-backend flashinfer --mamba-ssm-cache-dtype float16 --enable-mamba-cache-stochastic-rounding \
        --mamba-cache-philox-rounds 5 --enable-mamba-shared-prefix-checkpoint \
        --video-pruning-rate 0.5 --media-io-kwargs '{"video": {"fps": 2, "num_frames": 256}}' \
        --block-size 64 --prefix-match-unit 64 \
        --enable-auto-tool-choice --tool-call-parser qwen3_coder --reasoning-parser nemotron_v3 \
        --host 0.0.0.0 --port 8000
    resource:
      cpu: {cores: 12}
      memory: {size: 110GB}
      devices: {nvidia.com/gpu: 1}
    network:
      ports:
        - {name: openai, port: 8000, protocol: tcp}
    readiness-probe:
      http-get: {path: /health, port: 8000, scheme: HTTP}
      initial-delay-seconds: 60
      period-seconds: 15
      timeout-seconds: 5
      failure-threshold: 240
jobs:
  redteam:
    image: {uri: docker://python:3.12-slim}
    mounts: {/code: code}
    cwd: /code/app
    env:
      - PYTHONPATH=/code/site
      - PLANNER_URL=http://planner:8000/v1
      - VLLM_API_KEY=none
      - TAG=event1
      - SHARDS=4
      - REPS=3
    script: |
      #!/bin/sh
      python -m leaktest.run --cases cases/dev --reps $REPS --profile super35-vllm \
        --shard $((FB_TASK_ID - 1))/$SHARDS --tag $TAG --out-root /code/runs
    depends-on:
      - {name: planner, status: RUNNING}
    task-array: {start: 1, end: 4, concurrency: 2}
    policy: {timeout: {execute: 4h}}
    resource:
      cpu: {cores: 1}
      memory: {size: 2GB}
  leak-report:
    image: {uri: docker://python:3.12-slim}
    mounts: {/code: code}
    cwd: /code/app
    env:
      - PYTHONPATH=/code/site
      - TAG=event1
    script: |
      #!/bin/sh
      python -m leaktest.run --merge /code/runs/*_${TAG}_leaktest_s*of* --out /code/results/leaktest_$TAG.json
      cat /code/results/leaktest_$TAG.json
    depends-on:
      - {name: redteam, status: FINISHED}
    resource:
      cpu: {cores: 1}
      memory: {size: 1GB}
  scores:
    image: {uri: docker://python:3.12-slim}
    mounts: {/code: code}
    cwd: /code/app
    env:
      - PYTHONPATH=/code/site
      - PLANNER_URL=http://planner:8000/v1
      - VLLM_API_KEY=none
      - TAG=event1
      - REPS=3
    script: |
      #!/bin/sh
      for set in test dev; do
        python -m careplan run --cases cases/$set --conditions C0,C2 --reps $REPS --signals --allow-unfrozen \
          --profile C0=super35-vllm --profile C2=super35-vllm --tag ${TAG}_$set > /code/results/scores_${TAG}_$set.log 2>&1
        python scripts/h1_report.py $(ls -dt runs/*_${TAG}_$set | head -1) --cases cases/$set --out /code/results/scores_${TAG}_$set.json | tail -3
      done
    depends-on:
      - {name: planner, status: RUNNING}
    policy: {timeout: {execute: 4h}}
    resource:
      cpu: {cores: 1}
      memory: {size: 2GB}
